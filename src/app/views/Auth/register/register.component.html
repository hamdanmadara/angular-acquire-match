<!-- src/app/auth/signup/signup.component.html -->

<div class="flex gap-y-8 w-screen h-screen flex-col justify-center m-auto max-w-[90%] md:max-w-[42%]">
  <div class="flex flex-col gap-y-4">
    <img cImg width="80" height="80" src="./logo.jpg" alt="Logo" />
    <h1 class="text-3xl font-bold text-gray-700">Create a free account</h1>
    <p class="text-gray-400 text-sm">Sign up to get started</p>
  </div>
  <div class="flex flex-col">
    <!-- Error Alert -->
    <div *ngIf="errorMessage" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
      <span class="block sm:inline">{{ errorMessage }}</span>
    </div>

    <!-- Success Alert -->
    <div *ngIf="successMessage" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4">
      <span class="block sm:inline">{{ successMessage }}</span>
    </div>

    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" cForm>
      <div class="flex flex-col gap-y-3">
        <!-- Name Field -->
        <div class="flex flex-col gap-y-2">
          <label cLabel class="font-bold text-gray-700 block" for="name">Name</label>
          <input
            cFormControl
            class="rounded-none bg-purple-100 w-full py-2 px-3 border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500"
            [ngClass]="{'border-red-500': nameControl?.invalid && nameControl?.touched}"
            type="text"
            id="name"
            placeholder="Enter Your Name"
            formControlName="name"
          />
          <div *ngIf="nameControl?.invalid && nameControl?.touched" class="text-red-500 text-xs mt-1">
            <div *ngIf="nameControl?.errors?.['required']">Name is required</div>
            <div *ngIf="nameControl?.errors?.['minlength']">Name must be at least 3 characters</div>
          </div>
        </div>

        <!-- Email Field -->
        <div class="flex flex-col gap-y-2">
          <label cLabel class="font-bold text-gray-700 block" for="email">Email address</label>
          <input
            cFormControl
            class="rounded-none bg-purple-100 w-full py-2 px-3 border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500"
            [ngClass]="{'border-red-500': emailControl?.invalid && emailControl?.touched}"
            type="email"
            id="email"
            placeholder="Email address"
            formControlName="email"
          />
          <div *ngIf="emailControl?.invalid && emailControl?.touched" class="text-red-500 text-xs mt-1">
            <div *ngIf="emailControl?.errors?.['required']">Email is required</div>
            <div *ngIf="emailControl?.errors?.['email']">Please enter a valid email address</div>
          </div>
        </div>

        <!-- Password Field -->
        <div class="flex flex-col gap-y-2">
          <label cLabel class="font-bold text-gray-700 block" for="password">Password</label>
          <input
            cFormControl
            class="rounded-none bg-purple-100 w-full py-2 px-3 border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500"
            [ngClass]="{'border-red-500': passwordControl?.invalid && passwordControl?.touched}"
            type="password"
            id="password"
            placeholder="Password"
            formControlName="password"
          />
          <div *ngIf="passwordControl?.invalid && passwordControl?.touched" class="text-red-500 text-xs mt-1">
            <div *ngIf="passwordControl?.errors?.['required']">Password is required</div>
            <div *ngIf="passwordControl?.errors?.['minlength']">Password must be at least 6 characters</div>
          </div>
        </div>

        <!-- Signup Button with Loader -->
        <div>
          <button
            cButton
            class="bg-purple-800 py-2 mt-6 text-white w-full rounded-none hover:bg-purple-600 focus:outline-none focus:ring-2 focus:ring-purple-500"
            type="submit"
            [disabled]="isSubmitting || signupForm.invalid"
          >
            @if (isSubmitting) {
              <app-loader size="4" containerClass="flex justify-center items-center" text="Signing up..."></app-loader>
            } @else {
              <span>Sign Up</span>
            }
          </button>
        </div>

        <!-- Sign In Link -->
        <div class="text-center flex flex-col gap-y-1 mt-3">
          <div>
            <p>
              Already have an account?
              <span class="text-purple-500 underline cursor-pointer"><a [routerLink]="['/login']">Sign in</a></span>
            </p>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
